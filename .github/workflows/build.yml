name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unzip project if uploaded as zip
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -q -o "$z"; done || true

      - name: Locate project
        id: loc
        run: |
          f=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found. Repo contents:"; ls -R | head -60; exit 1
          fi
          d=$(dirname "$f")
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "Project dir: $d"; ls -la "$d"

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: EditFast-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
